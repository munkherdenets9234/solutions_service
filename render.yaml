services:
  - type: web
    name: digitalservice-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    # healthCheckPath stays /healthz: it answers "is the process up" and
    # nothing else, so a slow database cannot turn into a restart loop.
    # /readyz is the one that reports which optional features this deployment
    # actually has — check it after every deploy, and alert on degraded=true.
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      # PORT is injected automatically by Render — do not set it here.
      - key: MONGO_URI
        sync: false # external MongoDB (e.g. MongoDB Atlas) — Render has no managed MongoDB
      - key: MONGO_DB
        value: eandstravel
      - key: TOKEN_SECRET
        generateValue: true # must be at least 32 characters; Render generates a random one
      - key: TOKEN_EXPIRY_HOURS
        value: "24"

      # Optional. Blank leaves POST /api/v1/admin/uploads answering
      # 503 FEATURE_UNAVAILABLE, and /readyz reports it as disabled.
      - key: CLOUDINARY_URL
        sync: false
      - key: UPLOAD_MAX_BYTES
        value: "10485760"

      - key: SUPERADMIN_NAME
        value: Superadmin
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false

      # Required: API keys are resolved through tenantcore, and startup stops
      # without both. They also carry password-reset and request mail.
      - key: TENANTCORE_URL
        sync: false
      - key: TENANTCORE_SERVICE_KEY
        sync: false

      # Request email (staff are mailed when a request arrives) is opt-in: set
      # all three or none; one without the others stops startup. See
      # handover.md, "Request email deploy steps".
      - key: MAIL_UNSUBSCRIBE_KEY
        sync: false # at least 32 random bytes, generated on the host
      - key: PUBLIC_BASE_URL
        sync: false # this service's public https origin, no path
      - key: ADMIN_BASE_URL
        sync: false # the admin console's https origin, no path

      # Rate limiting. The buckets are per-instance, so these limits hold as
      # written only while this service runs a single replica. Scaling out
      # multiplies the effective limit by the replica count — move the
      # buckets to Redis before relying on them at more than one instance.
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_RATE_PER_MINUTE
        value: "10"
      - key: LEAD_RATE_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_BURST
        value: "5"
